<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>로그인 - 비품관리 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container page-login py-4 py-md-5">

<h1 class="page-title">비품관리 시스템</h1>
<p class="page-description">계정으로 로그인해 비품 관리 서비스를 이용하세요.</p>
<div class="page-content">

<div class="alert alert-danger" role="alert" th:if="${param.error}">
    <p>이메일 또는 비밀번호가 올바르지 않습니다.</p>
</div>

<div class="alert alert-success" role="status" th:if="${param.logout}">
    <p>로그아웃 되었습니다.</p>
</div>

<form th:action="@{/login}" method="post">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}"/>

    <div>
        <label class="form-label fw-semibold" for="email">이메일</label>

        <input class="form-control" type="email"
               id="email" autocomplete="username"
               name="email"
               placeholder="이메일을 입력하세요"
               required/>
    </div>

    <div>
        <label class="form-label fw-semibold" for="password">비밀번호</label>

        <input class="form-control" type="password"
               id="password" autocomplete="current-password"
               name="password"
               placeholder="비밀번호를 입력하세요"
               required/>
    </div>

    <button class="btn btn-primary w-100" type="submit">로그인</button>

</form>

</div>
</main>
</body>
</html>

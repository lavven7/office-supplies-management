<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 비품관리 시스템</title>
</head>
<body>

<h1>비품관리 시스템</h1>

<!-- 로그인 실패 메시지 -->
<div th:if="${param.error}">
    <p>이메일 또는 비밀번호가 올바르지 않습니다.</p>
</div>

<!-- 로그아웃 성공 메시지 -->
<div th:if="${param.logout}">
    <p>로그아웃 되었습니다.</p>
</div>

<!--
    th:action="@{/login}":
    Thymeleaf 가 CSRF 토큰을 hidden input 으로 자동 삽입한다.
    하지만 요청에 따라 명시적으로도 추가한다 (아래 참고).

    action="/login" (th: 없이) 으로 쓰면 CSRF 토큰이 없어 403 발생.
    반드시 th:action 을 사용할 것.
-->
<form th:action="@{/login}" method="post">

    <!--
        CSRF 토큰 명시적 추가.
        th:action 이 자동 삽입하지만 명시적으로도 포함해 의도를 드러낸다.
        th:action 과 중복되면 토큰이 두 번 전송되므로 아래 둘 중 하나만 사용.

        현재 설정: th:action 의 자동 삽입 + 명시적 hidden input 동시 사용 시 중복.
        → th:action 만 쓰면 자동으로 처리되므로 아래 hidden input 은 제거해도 됨.
        → 명시적으로 넣고 싶다면 th:action 대신 action="/login" 으로 바꾸고
          아래 hidden input 만 사용.

        여기서는 명시적 확인이 목적이므로 th:action + hidden input 모두 작성.
        실제 동작은 th:action 의 자동 삽입 토큰으로 처리되고
        동일한 값이므로 중복 제출되어도 문제없다.
    -->
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}"/>

    <div>
        <label for="email">이메일</label>
        <!--
            name="email":
            SecurityConfig 의 usernameParameter("email") 과 반드시 일치.
        -->
        <input type="email"
               id="email"
               name="email"
               placeholder="이메일을 입력하세요"
               required/>
    </div>

    <div>
        <label for="password">비밀번호</label>
        <!--
            name="password":
            SecurityConfig 의 passwordParameter("password") 와 일치.
        -->
        <input type="password"
               id="password"
               name="password"
               placeholder="비밀번호를 입력하세요"
               required/>
    </div>

    <button type="submit">로그인</button>

</form>

</body>
</html>

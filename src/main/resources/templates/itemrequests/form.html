<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>비품 요청 작성</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container page-form py-4 py-md-5">

<h1 class="page-title">비품 요청 작성</h1>
<p class="page-description">필요한 비품을 선택하고 요청 수량을 입력하세요.</p>
<div class="page-content">

<form th:action="@{/requests}" method="post">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <div>
        <label class="form-label fw-semibold" for="itemId">비품 선택</label>
        <select class="form-select" id="itemId" name="itemId" required>
            <option value="">-- 비품을 선택하세요 --</option>
            <option th:each="item : ${items}"
                    th:value="${item.id}"
                    th:text="${item.name} + ' (재고: ' + ${item.currentStock} + ')'">
            </option>
        </select>
    </div>

    <div>
        <label class="form-label fw-semibold" for="quantity">수량</label>
        <input class="form-control" type="number"
               id="quantity"
               name="quantity"
               min="1"
               value="1"
               required/>
    </div>

    <div class="actions">
    <button class="btn btn-primary" type="submit">요청하기</button>
    <a class="btn btn-outline-secondary" th:href="@{/requests}">취소</a>
    </div>

</form>

</div>
</main>
</body>
</html>

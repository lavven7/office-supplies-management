<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비품 요청 작성</title>
</head>
<body>

<h1>비품 요청 작성</h1>

<!--
    th:action="@{/requests}": POST /requests 로 전송.
    method="post": 데이터 변경이므로 POST 사용.
-->
<form th:action="@{/requests}" method="post">

    <!--
        CSRF 토큰.
        Spring Security 가 활성화된 경우 POST 요청에 CSRF 토큰이 없으면 403 발생.
        th:name, th:value 로 Thymeleaf 가 자동으로 토큰 값을 채워준다.
    -->
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <!-- 비품 선택 -->
    <!--
        th:each 로 items 리스트를 순회해 <option> 을 동적으로 생성.
        items 는 findActiveItems() 결과 — active = true 인 비품만 포함.
        th:value="${item.id}": 서버로 전송되는 값 (itemId).
        th:text: 화면에 표시되는 비품명 + 현재 재고.
        name="itemId" 가 Controller 의 @RequestParam Long itemId 와 일치해야 함.
    -->
    <div>
        <label for="itemId">비품 선택</label>
        <select id="itemId" name="itemId" required>
            <option value="">-- 비품을 선택하세요 --</option>
            <option th:each="item : ${items}"
                    th:value="${item.id}"
                    th:text="${item.name} + ' (재고: ' + ${item.currentStock} + ')'">
            </option>
        </select>
    </div>

    <!-- 수량 입력 -->
    <!--
        name="quantity" 가 Controller 의 @RequestParam Integer quantity 와 일치해야 함.
        min="1": 브라우저 레벨 최솟값 검증.
        Entity 생성자에서도 quantity < 1 이면 InvalidQuantityException 발생.
    -->
    <div>
        <label for="quantity">수량</label>
        <input type="number"
               id="quantity"
               name="quantity"
               min="1"
               value="1"
               required/>
    </div>

    <button type="submit">요청하기</button>
    <a th:href="@{/requests}">취소</a>

</form>

</body>
</html>

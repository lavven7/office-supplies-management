<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>비품 요청 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container page-container py-4 py-md-5">

<h1 class="page-title">비품 요청 상세</h1>
<p class="page-description">요청 품목과 처리 정보를 확인하세요.</p>
<div class="page-content">

<div class="table-responsive"><table class="table align-middle mb-0 detail-table">
    <tr>
        <th>요청자</th>

        <td th:text="${itemRequest.requester.name}"></td>
    </tr>
    <tr>
        <th>부서</th>
        <td th:text="${itemRequest.requester.department}"></td>
    </tr>
    <tr>
        <th>요청일</th>

        <td th:text="${#temporals.format(itemRequest.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    <tr>
        <th>상태</th>

        <td th:text="${itemRequest.status}"></td>
    </tr>

    <tr th:if="${itemRequest.rejectReason != null}">
        <th>반려 사유</th>
        <td th:text="${itemRequest.rejectReason}"></td>
    </tr>

    <tr th:if="${itemRequest.approver != null}">
        <th>처리자</th>
        <td th:text="${itemRequest.approver.name}"></td>
    </tr>
    <tr th:if="${itemRequest.approvalDate != null}">
        <th>처리일</th>
        <td th:text="${#temporals.format(itemRequest.approvalDate, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
</table></div>

<h2>요청 품목 목록</h2>

<div class="table-responsive"><table class="table table-hover align-middle mb-0">
    <thead class="table-light">
    <tr>
        <th>비품명</th>
        <th>요청 수량</th>
        <th>현재 재고</th>
    </tr>
    </thead>
    <tbody>

    <tr th:each="detail : ${itemRequest.details}">
        <td th:text="${detail.item.name}"></td>
        <td th:text="${detail.quantity}"></td>
        <td th:text="${detail.item.currentStock}"></td>
    </tr>
    </tbody>
</table></div>

<div th:if="${itemRequest.status.name() == 'REQUESTED'}"
     sec:authorize="hasRole('ADMIN')">

    <form th:action="@{/requests/{id}/approve(id=${itemRequest.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-primary" type="submit">승인</button>
    </form>

    <form class="mt-4 pt-4 border-top" th:action="@{/requests/{id}/reject(id=${itemRequest.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div>
            <label class="form-label fw-semibold" for="rejectReason">반려 사유</label>
            <input class="form-control" type="text"
                   id="rejectReason"
                   name="rejectReason"
                   placeholder="반려 사유를 입력하세요"
                   required
                   maxlength="500">
        </div>

        <button class="btn btn-outline-danger" type="submit">반려</button>
    </form>

</div>

<p>
    <a class="btn btn-outline-secondary" th:href="@{/requests}">요청 목록으로</a>

    <a class="btn btn-outline-secondary" th:href="@{/items}">비품 목록으로</a>
</p>

</div>
</main>
</body>
</html>

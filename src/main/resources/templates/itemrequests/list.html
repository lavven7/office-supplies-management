<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비품 요청 목록</title>
</head>
<body>
<h1>비품 요청 목록</h1>

<div>
    <span>로그인 사용자: </span>
    <span sec:authentication="principal.user.name"></span>
    <span> / </span>
    <span sec:authentication="principal.username"></span>
    <span> / </span>
    <span sec:authentication="principal.authorities"></span>
</div>

<form th:action="@{/logout}" method="post">
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">
    <button type="submit">로그아웃</button>
</form>

<a th:href="@{/requests/new}">비품 요청 작성</a>

<table border="1">
    <thead>
    <tr>
        <th>요청 ID</th>
        <th>요청자</th>
        <th>상태</th>
        <th>요청일</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(requests)}">
        <td colspan="4">요청 내역이 없습니다.</td>
    </tr>
    <tr th:each="request : ${requests}">
        <td>
            <a th:href="@{/requests/{id}(id=${request.id})}"
               th:text="${request.id}">
            </a>
        </td>
        <td th:text="${request.requester.name}">홍길동</td>
        <td th:text="${request.status}">REQUESTED</td>
        <td th:text="${#temporals.format(request.createdAt, 'yyyy-MM-dd')}">2026-07-06</td>
    </tr>
    </tbody>
</table>

</body>
</html>

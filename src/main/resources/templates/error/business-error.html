<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>오류 발생</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container page-form py-4 py-md-5">

<h1 class="page-title">요청을 처리할 수 없습니다</h1>
<p class="page-description">아래 내용을 확인한 후 다시 시도하세요.</p>
<div class="page-content">

<p>
    오류 코드: <span th:text="${errorCode}"></span>
</p>
<p>
    오류 내용: <span th:text="${errorMessage}"></span>
</p>

<a class="btn btn-outline-secondary" th:href="@{/requests}">요청 목록으로 돌아가기</a>

</div>
</main>
</body>
</html>

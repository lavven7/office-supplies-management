<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>비품 목록</title>
</head>
<body>
<h1>비품 목록</h1>

<p>
    <a th:href="@{/requests}">비품 요청 목록 보기</a>
</p>

<p sec:authorize="hasRole('ADMIN')">
    <a th:href="@{/items/new}">
        비품 등록
    </a>
</p>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>비품명</th>
        <th>카테고리</th>
        <th>현재 재고</th>
        <th>최소 재고</th>
        <th>재고 상태</th>
        <th>활성 상태</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${items}">
        <td><a th:href="@{/items/{id}(id=${item.id})}"
               th:text="${item.id}">
            1
            </a>
        </td>
        <td>
            <a th:href="@{/items/{id}(id=${item.id})}"
                th:text="${item.name}">
            A4 용지
        </a>
        </td>
        <td th:text="${item.category}">문구</td>
        <td th:text="${item.currentStock}">100</td>
        <td th:text="${item.minimumStock}">10</td>
        <td th:text="${item.lowStock ? '⚠️ 재고 부족' : '정상'}">
            정상
        </td>

        <td th:text="${item.active ? '활성' : '비활성'}">
            활성
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>

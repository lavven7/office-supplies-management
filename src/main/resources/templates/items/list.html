<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>비품 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container page-container py-4 py-md-5">
<h1 class="page-title">비품 목록</h1>
<p class="page-description">등록된 비품과 현재 재고를 확인하세요.</p>
<div class="page-content">

<p>
    <a class="btn btn-outline-secondary" th:href="@{/requests}">비품 요청 목록 보기</a>
</p>

<p sec:authorize="hasRole('ADMIN')">
    <a class="btn btn-outline-secondary" th:href="@{/items/new}">
        비품 등록
    </a>
</p>

<div class="table-responsive"><table class="table table-hover align-middle mb-0">
    <thead class="table-light">
    <tr>
        <th>ID</th>
        <th>비품명</th>
        <th>카테고리</th>
        <th>현재 재고</th>
        <th>최소 재고</th>
        <th>재고 상태</th>
        <th>활성 상태</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(items)}"><td colspan="7" class="text-center text-secondary py-4">등록된 비품이 없습니다.</td></tr>
    <tr th:each="item : ${items}">
        <td><a class="link-primary" th:href="@{/items/{id}(id=${item.id})}"
               th:text="${item.id}">
            1
            </a>
        </td>
        <td>
            <a class="link-primary" th:href="@{/items/{id}(id=${item.id})}"
                th:text="${item.name}">
            A4 용지
        </a>
        </td>
        <td th:text="${item.category}">문구</td>
        <td th:text="${item.currentStock}">100</td>
        <td th:text="${item.minimumStock}">10</td>
        <td th:text="${item.lowStock ? '⚠️ 재고 부족' : '정상'}">
            정상
        </td>

        <td th:text="${item.active ? '활성' : '비활성'}">
            활성
        </td>
    </tr>
    </tbody>
</table></div>

</div>
</main>
</body>
</html>

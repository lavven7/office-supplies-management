<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>재고 입고</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container page-form py-4 py-md-5">

    <!-- 페이지 제목 -->
    <div class="mb-4">
        <h2 class="fw-bold mb-1">재고 입고</h2>
        <p class="text-secondary mb-0">
            비품의 현재 재고를 확인하고 입고 수량을 입력하세요.
        </p>
    </div>

    <div class="row g-4">

        <!-- 비품 정보 -->
        <div class="col-lg-5">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body p-4">

                    <h5 class="card-title fw-semibold mb-4">
                        비품 정보
                    </h5>

                    <div class="mb-3">
                        <div class="text-secondary small mb-1">비품명</div>
                        <div class="fw-semibold"
                             th:text="${item.name}">
                            A4 용지
                        </div>
                    </div>

                    <hr>

                    <div class="row">
                        <div class="col-6">
                            <div class="text-secondary small mb-1">
                                현재 재고
                            </div>

                            <span class="fs-4 fw-bold"
                                  th:text="${item.currentStock}">
                                100
                            </span>
                            <span class="text-secondary">개</span>
                        </div>

                        <div class="col-6">
                            <div class="text-secondary small mb-1">
                                최소 재고
                            </div>

                            <span class="fs-4 fw-bold"
                                  th:text="${item.minimumStock}">
                                10
                            </span>
                            <span class="text-secondary">개</span>
                        </div>
                    </div>

                </div>
            </div>
        </div>


        <!-- 입고 폼 -->
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h5 class="card-title fw-semibold mb-4">
                        입고 수량 입력
                    </h5>

                    <form th:action="@{/items/{id}/inbound(id=${item.id})}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div class="mb-4">
                            <label for="quantity"
                                   class="form-label fw-semibold">
                                입고 수량
                            </label>

                            <div class="input-group">
                                <input type="number"
                                       class="form-control"
                                       id="quantity"
                                       name="quantity"
                                       min="1"
                                       value="1"
                                       required>

                                <span class="input-group-text">개</span>
                            </div>

                            <div class="form-text">
                                입고 처리할 수량을 입력하세요.
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/items/{id}(id=${item.id})}"
                               class="btn btn-outline-secondary">
                                취소
                            </a>

                            <button type="submit"
                                    class="btn btn-primary">
                                입고 처리
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>비품 등록</title>
</head>
<body>
<main>
    <h1>비품 등록</h1>

    // CSRF 토큰
    <form th:action="@{/items}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div>
            <label for="name">비품명</label>

            <input type="text"
                   id="name"
                   name="name"
                   required
                   maxlength="100">
        </div>

        <div>
            <label for="description">설명</label>

            <textarea id="description"
                      name="description"
                      rows="4"></textarea>
        </div>

        <div>
            <label for="category">카테고리</label>

            <input type="text"
                   id="category"
                   name="category"
                   maxlength="50">
        </div>

        <div>
            <label for="unitPrice">단가</label>

            <input type="number"
                   id="unitPrice"
                   name="unitPrice"
                   min="0"
                   step="0.01">
        </div>

        <div>
            <label for="currentStock">현재 재고</label>

            <input type="number"
                   id="currentStock"
                   name="currentStock"
                   min="0"
                   value="0"
                   required>
        </div>

        <div>
            <label for="minimumStock">최소 재고</label>

            <input type="number"
                   id="minimumStock"
                   name="minimumStock"
                   min="0"
                   value="0"
                   required>
        </div>

        <div>
            <button type="submit">
                등록
            </button>

            <a th:href="@{/items}">
                취소
            </a>
        </div>
    </form>
</main>
</body>
</html>

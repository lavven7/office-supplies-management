<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>비품 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container page-form py-4 py-md-5">

    <h1 class="page-title">비품 등록</h1>
<p class="page-description">새 비품의 기본 정보와 초기 재고를 입력하세요.</p>
<div class="page-content">

    <form th:action="@{/items}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div>
            <label class="form-label fw-semibold" for="name">비품명</label>

            <input class="form-control" type="text"
                   id="name"
                   name="name"
                   required
                   maxlength="100">
        </div>

        <div>
            <label class="form-label fw-semibold" for="description">설명</label>

            <textarea class="form-control" id="description"
                      name="description"
                      rows="4"></textarea>
        </div>

        <div>
            <label class="form-label fw-semibold" for="category">카테고리</label>

            <input class="form-control" type="text"
                   id="category"
                   name="category"
                   maxlength="50">
        </div>

        <div>
            <label class="form-label fw-semibold" for="unitPrice">단가</label>

            <input class="form-control" type="number"
                   id="unitPrice"
                   name="unitPrice"
                   min="0"
                   step="0.01">
        </div>

        <div>
            <label class="form-label fw-semibold" for="currentStock">현재 재고</label>

            <input class="form-control" type="number"
                   id="currentStock"
                   name="currentStock"
                   min="0"
                   value="0"
                   required>
        </div>

        <div>
            <label class="form-label fw-semibold" for="minimumStock">최소 재고</label>

            <input class="form-control" type="number"
                   id="minimumStock"
                   name="minimumStock"
                   min="0"
                   value="0"
                   required>
        </div>

        <div class="actions">
            <button class="btn btn-primary" type="submit">
                등록
            </button>

            <a class="btn btn-outline-secondary" th:href="@{/items}">
                취소
            </a>
        </div>
    </form>

</div>
</main>
</body>
</html>

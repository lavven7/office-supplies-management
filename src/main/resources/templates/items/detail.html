<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비품 상세</title>
</head>
<body>

<h1>비품 상세</h1>

<!-- 비품 기본 정보 -->
<table border="1">
    <tr>
        <th>ID</th>
        <td th:text="${item.id}"></td>
    </tr>
    <tr>
        <th>비품명</th>
        <td th:text="${item.name}"></td>
    </tr>
    <tr>
        <th>설명</th>
        <!--
            description 은 nullable.
            null 이면 '-'으로 표시
        -->
        <td th:text="${item.description != null ? item.description : '-'}"></td>
    </tr>
    <tr>
        <th>카테고리</th>
        <td th:text="${item.category != null ? item.category : '-'}"></td>
    </tr>
    <tr>
        <th>단가</th>
        <!--
            unitPrice 는 BigDecimal, nullable.
            null 이면 '-'
        -->
        <td th:text="${item.unitPrice != null ? item.unitPrice : '-'}"></td>
    </tr>
    <tr>
        <th>현재 재고</th>
        <td th:text="${item.currentStock}"></td>
    </tr>
    <tr>
        <th>최소 재고</th>
        <td th:text="${item.minimumStock}"></td>
    </tr>
    <tr>
        <th>재고 상태</th>
        <td th:text="${item.lowStock ? '⚠️ 재고 부족' : '정상'}">
            정상
        </td>
    </tr>
    <tr>
        <th>활성 여부</th>
        <td th:text="${item.active ? '활성' : '비활성'}">
            활성
        </td>
    </tr>
    <tr>
        <th>등록일</th>
        <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    <tr>
        <th>수정일</th>
        <td th:text="${#temporals.format(item.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
</table>

<hr/>

<h2>재고 이력</h2>

<!--
    histories 가 비어 있으면 "이력 없음" 표시.
    th:if / th:unless 로 조건 분기.
-->
<p th:if="${#lists.isEmpty(histories)}">재고 이력이 없습니다.</p>

<table th:unless="${#lists.isEmpty(histories)}" border="1">
    <thead>
    <tr>
        <th>일시</th>
        <th>유형</th>
        <th>수량</th>
        <th>변경 전</th>
        <th>변경 후</th>
        <th>처리자</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="history : ${histories}">
        <!--
            createdAt 은 BaseCreatedEntity 에서 상속한 필드.
            LocalDateTime 포맷.
        -->
        <td th:text="${#temporals.format(history.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <!--
            historyType 은 HistoryType enum.
            .name() 으로 문자열 표시 (INBOUND / OUTBOUND / ADJUSTMENT).
            enum 에 description 필드가 있으면 history.historyType.description 사용 가능.
        -->
        <td th:text="${history.historyType.name()}"></td>
        <td th:text="${history.quantity}"></td>
        <td th:text="${history.beforeStock}"></td>
        <td th:text="${history.afterStock}"></td>
        <!--
            createdBy 는 @ManyToOne(fetch = LAZY).
            InventoryHistoryService.findByItem() 호출 시
            LAZY 로딩으로 createdBy 를 가져오는 추가 쿼리가 발생한다.
            MVP 단계에서는 허용, 이력이 많아지면 fetch join 으로 개선.
        -->
        <td th:text="${history.createdBy.name}"></td>
    </tr>
    </tbody>
</table>

<p>
    <a th:href="@{/items}">비품 목록으로</a>
    |
    <a th:href="@{/requests}">비품 요청 목록으로</a>
</p>

</body>
</html>

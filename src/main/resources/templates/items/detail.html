<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>비품 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container page-container py-4 py-md-5">

<h1 class="page-title">비품 상세</h1>
<p class="page-description">비품 정보와 재고 변경 이력을 확인하세요.</p>
<div class="page-content">

<div class="table-responsive"><table class="table align-middle mb-0 detail-table">
    <tr>
        <th>ID</th>
        <td th:text="${item.id}"></td>
    </tr>
    <tr>
        <th>비품명</th>
        <td th:text="${item.name}"></td>
    </tr>
    <tr>
        <th>설명</th>

        <td th:text="${item.description != null ? item.description : '-'}"></td>
    </tr>
    <tr>
        <th>카테고리</th>
        <td th:text="${item.category != null ? item.category : '-'}"></td>
    </tr>
    <tr>
        <th>단가</th>

        <td th:text="${item.unitPrice != null ? item.unitPrice : '-'}"></td>
    </tr>
    <tr>
        <th>현재 재고</th>
        <td th:text="${item.currentStock}"></td>
    </tr>
    <tr>
        <th>최소 재고</th>
        <td th:text="${item.minimumStock}"></td>
    </tr>
    <tr>
        <th>재고 상태</th>
        <td th:text="${item.lowStock ? '⚠️ 재고 부족' : '정상'}">
            정상
        </td>
    </tr>
    <tr>
        <th>활성 여부</th>
        <td th:text="${item.active ? '활성' : '비활성'}">
            활성
        </td>
    </tr>
    <tr>
        <th>등록일</th>
        <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    <tr>
        <th>수정일</th>
        <td th:text="${#temporals.format(item.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
</table></div>

<hr/>

<h2>재고 이력</h2>

<p th:if="${#lists.isEmpty(histories)}">재고 이력이 없습니다.</p>

<div class="table-responsive"><table class="table table-hover align-middle mb-0" th:unless="${#lists.isEmpty(histories)}">
    <thead class="table-light">
    <tr>
        <th>일시</th>
        <th>유형</th>
        <th>수량</th>
        <th>변경 전</th>
        <th>변경 후</th>
        <th>처리자</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="history : ${histories}">

        <td th:text="${#temporals.format(history.createdAt, 'yyyy-MM-dd HH:mm')}"></td>

        <td th:text="${history.historyType.name()}"></td>
        <td th:text="${history.quantity}"></td>
        <td th:text="${history.beforeStock}"></td>
        <td th:text="${history.afterStock}"></td>

        <td th:text="${history.createdBy.name}"></td>
    </tr>
    </tbody>
</table></div>

<div sec:authorize="hasRole('ADMIN')"
     th:if="${item.active}">

    <form th:action="@{/items/{id}/deactivate(id=${item.id})}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button class="btn btn-outline-danger" type="submit"
                onclick="return confirm('이 비품을 비활성화하시겠습니까?')">
            비활성화
        </button>
    </form>

</div>
<p sec:authorize="hasRole('ADMIN')">
    <a class="btn btn-outline-secondary" th:href="@{/items/{id}/inbound(id=${item.id})}">
        재고 입고
    </a>
</p>

<div sec:authorize="hasRole('ADMIN')"
     th:unless="${item.active}">
    <p>비활성화된 비품입니다.</p>
</div>

<p>
    <a class="btn btn-outline-secondary" th:href="@{/items}">비품 목록으로</a>

    <a class="btn btn-outline-secondary" th:href="@{/requests}">비품 요청 목록으로</a>
</p>

</div>
</main>
</body>
</html>
